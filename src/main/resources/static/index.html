<h1>Resume Analysis</h1>

<input type="file" id="analyzeFile" accept=".pdf">
<br><br>
<textarea id="jobDescription" rows="6" cols="50" placeholder="Paste job description here..."></textarea>
<br><br>
<button onclick="analyzeResume()">Analyze Resume</button>

<pre id="analyzeResult"></pre>

<script>
    function analyzeResume() {
        const fileInput = document.getElementById("analyzeFile");
        const file = fileInput.files[0];
        const jobDescription = document.getElementById("jobDescription").value;

        if (!file || !jobDescription) {
            document.getElementById("analyzeResult").innerText = "Please select a file and enter a job description.";
            return;
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("jobDescription", jobDescription);

        document.getElementById("analyzeResult").innerText = "Analyzing... please wait.";

        fetch("http://localhost:8080/api/analyze", {
            method: "POST",
            body: formData
        })
        .then(response => response.text())
        .then(data => {
            document.getElementById("analyzeResult").innerText = data;
        })
        .catch(error => {
            document.getElementById("analyzeResult").innerText = "Error: " + error;
        });
    }
</script>
